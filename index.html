<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday - Start</title>
  <meta name="description" content="A private birthday gift website." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .loader-page {
      background: radial-gradient(ellipse 80% 60% at 50% 40%, #2A1A1E 0%, #1A0F14 55%, #0E080C 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      color: #F7F2E9;
    }
    .loader-page::before {
      content: "";
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 60% 70% at 50% 50%, rgba(184,120,140,0.22), transparent 60%),
        radial-gradient(ellipse 40% 30% at 80% 30%, rgba(201,162,39,0.14), transparent 50%),
        radial-gradient(ellipse 40% 30% at 20% 65%, rgba(123,45,67,0.18), transparent 50%);
      pointer-events: none;
    }
    .loader-page__sparkles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
    .loader-page__sparkles span {
      position: absolute; width: 4px; height: 4px; background: #E8C9D8; border-radius: 50%;
      box-shadow: 0 0 5px 2px rgba(200,160,170,0.45); animation: sparkle-fall linear infinite;
    }
    @keyframes sparkle-fall {
      0%   { transform: translateY(-18px) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; } 90%  { opacity: 1; } 100% { transform: translateY(115vh) rotate(720deg); opacity: 0; }
    }
    .loader-page__sparkles span.slow   { animation-duration: 4s; }
    .loader-page__sparkles span.fast  { animation-duration: 2.4s; }
    .loader-page__sparkles span.big   { width: 8px; height: 8px; }
    .loader-page__sparkles span.huge  { width: 12px; height: 12px; }

    .loader-page__lottie {
      width: 400px; height: 400px;
      margin-bottom: var(--space-6);
      position: relative; z-index: 2;
    }
    @media (max-width: 500px) { .loader-page__lottie { width: 280px; height: 280px; } }

    .loader-page__music { position: fixed; bottom: 24px; left: 24px; z-index: 3; font-size: 1.8rem; opacity: 0.25; animation: float-up 4s var(--ease-bouncy) infinite; pointer-events: none; user-select: none; }
    @keyframes float-up { 0% { transform: translateY(0); opacity: 0.25; } 50% { transform: translateY(-22px); opacity: 0.35; } 100% { transform: translateY(0); opacity: 0.25; } }

    .loader-page__title { position: relative; z-index: 2; text-align: center; padding: 0 var(--space-4); pointer-events: none; }
    .loader-page__title h1 {
      font-family: var(--font-serif); font-size: clamp(2.4rem, 6vw, 4rem); font-weight: 600;
      letter-spacing: 0.02em; color: #F7F2E9; text-shadow: 0 2px 14px rgba(255,255,255,0.14);
    }
    .loader-page__subtitle {
      text-transform: uppercase; letter-spacing: 0.24em; font-size: 0.75rem; font-weight: 600;
      color: #E8C9D8; margin-top: var(--space-2);
    }
    .loader-page__subline { font-size: 1.05rem; color: #E3B06A; font-style: italic; font-weight: 400; }

    .loader-page__overlay {
      position: relative; z-index: 4; text-align: center; padding: var(--space-4);
      pointer-events: none; opacity: 0; transition: opacity var(--duration-slow) var(--ease-soft);
    }
    .loader-page__overlay.show { opacity: 1; }
    .loader-page__overlay p { font-size: 1.1rem; color: #F7F2E9; font-style: italic; }
    .loader-page__overlay .hint { font-size: 0.8rem; color: #A85A6E; margin-top: var(--space-2); }
    .loader-page__btn {
      display: inline-block; margin-top: var(--space-3); padding: var(--space-3) var(--space-5);
      border: 2px solid var(--rose); border-radius: var(--radius-full); color: var(--rose);
      font-weight: 600; letter-spacing: 0.06em; cursor: pointer;
      transition: transform var(--duration-soft) var(--ease-soft), background var(--duration-soft) var(--ease-soft);
      background: rgba(123,45,67,0.12); pointer-events: auto;
    }
    .loader-page__btn:hover { transform: scale(1.06); background: rgba(123,45,67,0.20); }
    .loader-page__btn:active { transform: scale(0.97); }
    .loader-page.hidden { opacity: 0; pointer-events: none; transition: opacity 0.8s var(--ease-soft); }
  </style>
</head>
<body>

<div class="loader-page" id="loaderPage">
  <div class="loader-page__sparkles" id="sparkles"></div>
  <div class="loader-page__music">&#9835;</div>

  <div class="loader-page__lottie" id="lottieContainer"></div>

  <div class="loader-page__title">
    <p class="loader-page__subtitle">Happy Birthday</p>
    <h1>Let's begin.</h1>
    <p class="loader-page__subline">Your music is already playing.</p>
  </div>

  <div class="loader-page__overlay" id="overlay">
    <p>Tap the cakes — blow out the candles.</p>
    <p class="hint">The song is covered by the real music.</p>
    <button class="loader-page__btn" id="blowBtn">Blow out the candles</button>
  </div>
</div>

<audio id="giftMusic" preload="auto" loop>
  <source src="assets/song/adore-you.mp3" type="audio/mpeg">
</audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<script>
  (function () {
    "use strict";

    var loaderPage = document.getElementById("loaderPage");
    var container = document.getElementById("lottieContainer");
    var sparklesEl = document.getElementById("sparkles");
    var overlay = document.getElementById("overlay");
    var blowBtn = document.getElementById("blowBtn");
    var audio = document.getElementById("giftMusic");

    // Build sparkles
    function buildSparkles() {
      for (var i = 0; i < 40; i++) {
        var s = document.createElement("span");
        s.className = "slow";
        if (i % 3 === 0) s.className += " big";
        if (i % 5 === 0) s.className += " huge";
        if (i % 4 === 0) s.className += " fast";
        s.style.left = Math.random() * 100 + "%";
        s.style.top = Math.random() * 100 + "%";
        s.style.animationDuration = (Math.random() * 2.5 + 1.5) + "s";
        s.style.animationDelay = (Math.random() * 4) + "s";
        s.style.opacity = (Math.random() * 0.35 + 0.1);
        sparklesEl.appendChild(s);
      }
    }
    buildSparkles();

    // Autoplay: music starts the moment the page opens, no click needed
    audio.volume = 0.70;
    audio.play().catch(function () {});

    // Load Lottie animation from local assets folder
    function loadLottie() {
      fetch('assets/loading.json')
        .then(function (response) { return response.json(); })
        .then(function (data) {
          var animData = {
            container: container,
            renderer: "svg",
            loop: true,
            autoplay: true,
            animationData: data
          };
          lottie.loadAnimation(animData);
        })
        .catch(function (err) {
          // Fallback: try with require() (module context)
          try {
            var animDataMod = {
              container: container,
              renderer: "svg",
              loop: true,
              autoplay: true,
              animationData: require('./assets/loading.json')
            };
            lottie.loadAnimation(animDataMod);
          } catch (e2) {
            // Last resort: try CDN fallback animation
            console.warn("Lottie not loaded:", err);
          }
        });
    }
    loadLottie();

    // Blow out the candles
    function onBegin() {
      var title = document.querySelector(".loader-page__title h1");
      if (title) {
        title.style.transition = "transform 0.15s";
        title.style.transform = "scale(1.04)";
        setTimeout(function () { title.style.transform = "scale(1)"; }, 150);
      }
      overlay.classList.add("show");
      setTimeout(function () {
        loaderPage.classList.add("hidden");
        setTimeout(function () {
          window.location.hash = "top";
          window.scrollTo({ top: 0, behavior: "smooth" });
        }, 700);
      }, 800);
    }

    blowBtn.addEventListener("click", onBegin);
    loaderPage.addEventListener("click", onBegin);
    loaderPage.addEventListener("touchstart", function (e) { e.preventDefault(); onBegin(); });
    document.addEventListener("keydown", function (e) {
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); onBegin(); }
    });
  })();
</script>
</body>
</html>
