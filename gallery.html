<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Gallery — Happy Birthday</title>
  <meta name="description" content="A timeline of the things we've shared." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="wrap">

    <nav class="wrap nav" aria-label="Page navigation">
      <a href="index.html">&larr; Back to the intro</a>
    </nav>

    <section class="page-head">
      <p class="eyebrow">The Gallery</p>
      <h1>A timeline of the things we&rsquo;ve shared.</h1>
      <p class="intro-sub">No dates. Just moments. The way we felt matters more than the day it happened.</p>
    </section>

    <div class="gallery-grid wrap" id="galleryGrid">
      <figure class="photo-card reveal" data-delay="1">
        <img src="assets/placeholder-photo-1.jpg" alt="The day we met" loading="lazy" />
        <figcaption>
          <strong>How we met</strong>
          <span>[[Describe the moment &mdash; what you were wearing, what we ate]]</span>
        </figcaption>
      </figure>

      <figure class="photo-card reveal" data-delay="2">
        <img src="assets/placeholder-photo-2.jpg" alt="A love moment" loading="lazy" />
        <figcaption>
          <strong>A love moment</strong>
          <span>[[What this photo means to us]]</span>
        </figcaption>
      </figure>

      <figure class="photo-card reveal" data-delay="3">
        <img src="assets/placeholder-photo-3.jpg" alt="A love moment" loading="lazy" />
        <figcaption>
          <strong>A trip</strong>
          <span>[[The place we went, the way it smelled there]]</span>
        </figcaption>
      </figure>

      <figure class="photo-card reveal" data-delay="4">
        <img src="assets/placeholder-photo-4.jpg" alt="A love moment" loading="lazy" />
        <figcaption>
          <strong>Ordinary Tuesday</strong>
          <span>[[What made this Tuesday ordinary in the best way]]</span>
        </figcaption>
      </figure>

      <figure class="photo-card reveal" data-delay="5">
        <img src="assets/placeholder-photo-5.jpg" alt="A love moment" loading="lazy" />
        <figcaption>
          <strong>Now</strong>
          <span>Some days, I still can&rsquo;t believe you&rsquo;re mine.</span>
        </figcaption>
      </figure>

      <figure class="photo-card reveal" data-delay="6">
        <img src="assets/placeholder-photo-6.jpg" alt="A love moment" loading="lazy" />
        <figcaption>
          <strong>[[Caption]]</strong>
          <span>[[A note about this photo, in your voice]]</span>
        </figcaption>
      </figure>
    </div>

    <footer class="wrap footer">
      <p>This gallery is private.</p>
    </footer>

  </main>

  <script src="app.js"></script>
</body>
</html>
